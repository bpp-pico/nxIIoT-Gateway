services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - ./gateway:/app
      - gateway-data:/app/data
    environment:
      - CGO_ENABLED=0
      - SEED_DEMO_DEVICE=true
      # Default dev transport is MQTT (the production path, Phase 5) via
      # the mosquitto service below. FORWARDER_SERVER_URL stays set so
      # switching back to the HTTP dev adapter only needs
      # FORWARDER_TRANSPORT=http overridden (e.g. `docker compose run -e
      # FORWARDER_TRANSPORT=http gateway`), not an edit to this file.
      - FORWARDER_TRANSPORT=mqtt
      - FORWARDER_SERVER_URL=http://server-sim:9000/ingest
      - MQTT_BROKER_URL=tcp://mosquitto:1883
    depends_on:
      - modbus-sim
      - mosquitto
      - server-sim
    # RS-485/USB-serial adapters are not visible inside a container unless
    # explicitly passed through, so the COM port dropdown (GET
    # /api/system/serial-ports) is empty by default here. On a Linux host
    # with a real adapter attached, uncomment and adjust:
    # devices:
    #   - "/dev/ttyUSB0:/dev/ttyUSB0"

  # Dev/test-only Modbus TCP simulator standing in for a real field device
  # (e.g. a power meter) so the acquisition engine can be exercised without
  # physical RS-485/Modbus hardware. Not part of the production stack.
  modbus-sim:
    build:
      context: ./gateway
      dockerfile: Dockerfile.modbus-sim
    ports:
      - "1502:502"

  # Dev/test-only fake "Internal Server" so Store & Forward can be
  # exercised end-to-end without a real backend. Speaks both HTTP
  # (HTTPAdapter, port 9000) and MQTT (MQTTAdapter, via mosquitto) — see
  # cmd/server-sim. Not part of the production stack.
  server-sim:
    build:
      context: ./gateway
      dockerfile: Dockerfile.server-sim
    ports:
      - "9000:9000"
    environment:
      - MQTT_BROKER_URL=tcp://mosquitto:1883
    depends_on:
      - mosquitto

  # Dev/test-only MQTT broker (Phase 5, §15). Anonymous/unencrypted,
  # matching the closed OT network assumption — see configs/mosquitto.conf.
  # Not part of the production stack; production points MQTTConfig at the
  # real internal broker.
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./gateway/configs/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    environment:
      - GATEWAY_API_URL=http://gateway:8080
    depends_on:
      - gateway

volumes:
  gateway-data:
